# =============================================================================
# Deschide News - Local Development Nginx Configuration
# Domain: deschide.local / api.deschide.local
# No SSL - plain HTTP on port 80
# =============================================================================
#
# Usage:
#   1. Add to /etc/hosts:
#      127.0.0.1  deschide.local api.deschide.local
#   2. Symlink this file:
#      sudo ln -s /var/www/deschide_news_app/scripts/nginx/deschide-local.conf \
#          /etc/nginx/sites-enabled/deschide-local.conf
#   3. Reload nginx:
#      sudo nginx -t && sudo systemctl reload nginx
#
# =============================================================================

# --- Upstream definitions ---------------------------------------------------

upstream php_fpm_local {
    server unix:/run/php/php-fpm-deschide.sock;
}

upstream nextjs_local {
    server 127.0.0.1:3005;
}

# =============================================================================
# Backend API: api.deschide.local
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.deschide.local;

    root /var/www/deschide_news_app/apps/backend/public;

    # --- Security headers ---------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options  nosniff                          always;
    add_header X-Frame-Options         DENY                             always;
    add_header Referrer-Policy         strict-origin-when-cross-origin  always;

    # --- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        application/json
        application/ld+json
        text/css
        application/javascript
        text/xml
        application/xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 5;

    # --- Upload limit -------------------------------------------------------
    client_max_body_size 15M;

    # --- Logging ------------------------------------------------------------
    access_log /var/log/nginx/api.deschide.local.access.log;
    error_log  /var/log/nginx/api.deschide.local.error.log;

    # --- Static files (images, uploads) with short cache for dev ------------
    location /uploads/ {
        alias /var/www/deschide_news_app/apps/backend/public/uploads/;
        expires 1h;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # --- Symfony front controller -------------------------------------------
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_fpm_local;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_buffer_size   128k;
        fastcgi_buffers       4 256k;
        fastcgi_read_timeout  120;
        internal;
    }

    # --- Deny direct PHP access ---------------------------------------------
    location ~ \.php$ {
        return 404;
    }
}

# =============================================================================
# Frontend: deschide.local
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name deschide.local;

    # --- Security headers ---------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options  nosniff  always;
    add_header X-Frame-Options         SAMEORIGIN always;

    # --- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 5;

    # --- Logging ------------------------------------------------------------
    access_log /var/log/nginx/deschide.local.access.log;
    error_log  /var/log/nginx/deschide.local.error.log;

    # --- Next.js static assets ----------------------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs_local;
        expires 1h;
        add_header Cache-Control "public";
    }

    # --- Next.js HMR (Hot Module Replacement) WebSocket ---------------------
    location /_next/webpack-hmr {
        proxy_pass http://nextjs_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }

    # --- Next.js image optimization -----------------------------------------
    location /_next/image {
        proxy_pass http://nextjs_local;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Proxy to Next.js ---------------------------------------------------
    location / {
        proxy_pass http://nextjs_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout  60;
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
    }
}
