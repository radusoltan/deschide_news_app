# =============================================================================
# Deschide News - Production Nginx Configuration
# Domain: deschide.md / api.deschide.md
# =============================================================================

# --- Upstream definitions ---------------------------------------------------

upstream php_fpm {
    server unix:/run/php/php-fpm-deschide.sock;
}

upstream nextjs {
    server 127.0.0.1:3005;
}

# --- HTTP -> HTTPS redirect -------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name deschide.md www.deschide.md api.deschide.md;
    return 301 https://$host$request_uri;
}

# --- www -> non-www redirect ------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.deschide.md;

    ssl_certificate     /etc/letsencrypt/live/deschide.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deschide.md/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://deschide.md$request_uri;
}

# =============================================================================
# Backend API: api.deschide.md
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.deschide.md;

    root /var/www/deschide_news_app/apps/backend/public;

    # --- SSL ----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/deschide.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deschide.md/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options  nosniff                          always;
    add_header X-Frame-Options         DENY                             always;
    add_header Referrer-Policy         strict-origin-when-cross-origin  always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        application/json
        application/ld+json
        text/css
        application/javascript
        text/xml
        application/xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 5;

    # --- Upload limit -------------------------------------------------------
    client_max_body_size 15M;

    # --- Logging ------------------------------------------------------------
    access_log /var/log/nginx/api.deschide.md.access.log;
    error_log  /var/log/nginx/api.deschide.md.error.log;

    # --- Static files (images, uploads) with long cache ---------------------
    location /uploads/ {
        alias /var/www/deschide_news_app/apps/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # --- Symfony front controller -------------------------------------------
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_buffer_size   128k;
        fastcgi_buffers       4 256k;
        fastcgi_read_timeout  60;
        internal;
    }

    # --- Deny direct PHP access ---------------------------------------------
    location ~ \.php$ {
        return 404;
    }
}

# =============================================================================
# Frontend: deschide.md
# =============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name deschide.md;

    # --- SSL ----------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/deschide.md/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deschide.md/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Security headers ---------------------------------------------------
    server_tokens off;
    add_header X-Content-Type-Options  nosniff                          always;
    add_header X-Frame-Options         SAMEORIGIN                       always;
    add_header Referrer-Policy         strict-origin-when-cross-origin  always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Gzip ---------------------------------------------------------------
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
    gzip_comp_level 5;

    # --- Logging ------------------------------------------------------------
    access_log /var/log/nginx/deschide.md.access.log;
    error_log  /var/log/nginx/deschide.md.error.log;

    # --- Next.js static assets with long cache ------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # --- Next.js image optimization -----------------------------------------
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Proxy to Next.js ---------------------------------------------------
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout  60;
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
    }
}
