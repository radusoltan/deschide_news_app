# Nginx Configuration for Deschide News Backend with Cloudflare CDN
# This configuration proxies requests from Nginx (SSL/TLS termination) to Varnish (HTTP cache)
#
# Architecture:
# Cloudflare Edge (HTTPS) → Nginx (HTTPS, this config) → Varnish (HTTP:6081) → Symfony (HTTP:8081)

server {
    listen 80;
    server_name api.deschide.md;

    # Redirect HTTP to HTTPS (Cloudflare will handle this, but good to have)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.deschide.md;

    # Cloudflare Origin Certificate (generated in Cloudflare dashboard)
    ssl_certificate /etc/cloudflare-certs/cert.pem;
    ssl_certificate_key /etc/cloudflare-certs/key.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS (Optional - Cloudflare can handle this)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/api.deschide.md.access.log;
    error_log /var/log/nginx/api.deschide.md.error.log;

    # Root location - proxy to Varnish
    location / {
        # Proxy to Varnish on port 6081
        proxy_pass http://127.0.0.1:6081;

        # Pass original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cloudflare headers (available when behind Cloudflare)
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering (can be disabled for real-time apps)
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Error handling
        proxy_intercept_errors off;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

