;; ============================================================================
;; PgBouncer Configuration for Deschide News Backend
;; Database: deschide | User: deschide_admin | PostgreSQL 17.6
;; ============================================================================

[databases]
; Deschide News production database
deschide = host=127.0.0.1 port=5432 dbname=deschide

[pgbouncer]

;;; Administrative settings
unix_socket_dir = /var/run/postgresql
logfile = /var/log/postgresql/pgbouncer.log
pidfile = /var/run/postgresql/pgbouncer.pid

;;; Connection settings
listen_addr = 127.0.0.1
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Admin and stats users
admin_users = postgres, deschide_admin
stats_users = stats, postgres

;;; Pool mode (transaction = best for Symfony/Doctrine)
pool_mode = transaction

;;; Connection limits
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 5
max_db_connections = 100
max_user_connections = 100

;;; Timeouts
client_idle_timeout = 0
server_idle_timeout = 600
server_connect_timeout = 15
query_timeout = 0
client_login_timeout = 60

;;; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 60

;;; Performance tuning
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 10
server_lifetime = 3600
server_check_delay = 30
dns_max_ttl = 15
dns_nxdomain_ttl = 15

;;; Advanced settings
cancel_wait_timeout = 10
application_name_add_host = 1
ignore_startup_parameters = extra_float_digits,options
disable_pqexec = 0
so_reuseport = 1
verbose = 1
