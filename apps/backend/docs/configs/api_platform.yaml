api_platform:
    title: Deschide News API
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
        multipart: ['multipart/form-data']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin', 'Accept-Language']
            # HTTP Cache - public endpoints can be cached
            max_age: 3600                    # 1 hour browser cache
            shared_max_age: 7200             # 2 hours CDN/proxy cache
            public: true                     # Allow caching by proxies/CDN
            # For private/authenticated data, these will be overridden per-resource
