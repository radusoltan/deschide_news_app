          - slug: moldova-presidential-elections-2024
            translations:
              ro:
                name: Prezidențialele 2024 & duelul Maia Sandu — Alexandr Stoianoglo
                description: 'Alegerile prezidențiale din toamna 2024 au fixat pentru doi ani agenda politică internă: Maia Sandu a obținut un nou mandat într-o confruntare polarizată cu Alexandr Stoianoglo. Scrutinul a fost citit simultan ca referendum asupra guvernării, test de reziliență instituțională și diagnostic al influenței rusești. În 2026, orice subiect mare de politică internă se citește prin filtrul acestui duel.

                  '
              en:
                name: 2024 Presidential Elections & Sandu — Stoianoglo Duel
                description: 'Autumn 2024 presidential elections set the domestic political agenda for two years: Maia Sandu won a new mandate in a polarized confrontation with Alexandr Stoianoglo. The vote was read simultaneously as a referendum on governance, a test of institutional resilience and a diagnosis of Russian influence. In 2026, every major domestic political topic is read through the filter of this duel.

                  '
              ru:
                name: Президентские выборы 2024 & дуэль Санду — Стояногло
                description: 'Президентские выборы осени 2024 задали внутриполитическую повестку на два года: Майя Санду получила новый мандат в поляризованном противостоянии с Александром Стояногло. Голосование читалось одновременно как референдум о власти, тест институциональной устойчивости и диагноз российского влияния.

