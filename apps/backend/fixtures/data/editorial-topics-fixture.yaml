        sort_order: 1
        topics:
          - slug: moldova-eu-referendum-2024
            translations:
              ro:
                name: Referendumul UE din 20 octombrie 2024
                description: 'Referendumul constituțional privind consacrarea direcției europene a trecut la limită (50,4% „Da"), transformând aderarea din mesaj electoral în ancoră constituțională. În 2026 rămâne activ prin modul în care fiecare reformă este reambalată ca „îndeplinire a mandatului referendumului" sau, invers, ca „dezamăgire a promisiunii europene".

                  '
              en:
                name: EU Referendum of October 20, 2024
                description: 'Constitutional referendum on enshrining European direction passed narrowly (50.4% "Yes"), transforming EU accession from an electoral message into a constitutional anchor. In 2026 remains active as every reform is repackaged as "fulfillment of the referendum mandate" or, conversely, as "disappointment of the European promise".

                  '
              ru:
                name: Референдум о ЕС 20 октября 2024
                description: 'Конституционный референдум о европейском курсе прошёл на пределе (50,4% «Да»), превратив вступление в ЕС из электорального посыла в конституционный якорь. В 2026 остаётся активным — каждая реформа подаётся как «выполнение мандата референдума» или, наоборот, как «разочарование европейским обещанием».

                  '
            is_sensitive: false
            keywords:
