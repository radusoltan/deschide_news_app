; Sprint 55 T55.1 — Transport split (ADR-020 D2 + S55 audit D3).
;
; Replaces the single messenger-editorial-verification pool (numprocs=2) with
; two independently-scaled pools so low-volume Aggregate+Verify messages no
; longer FIFO-starve behind high-volume Extract+Flush ticks.
;
; Backup of the pre-split config is kept in /tmp/messenger-editorial-verification.pre-s55-split.YYYYMMDD.

[program:messenger-editorial-verification-extract]
command=/usr/bin/symfony console messenger:consume editorial_verification_extract --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=4
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-editorial-verification-extract.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-editorial-verification-extract.error.log
stderr_logfile_maxbytes=10MB

[program:messenger-editorial-verification-decide]
command=/usr/bin/symfony console messenger:consume editorial_verification_decide --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-editorial-verification-decide.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-editorial-verification-decide.error.log
stderr_logfile_maxbytes=10MB
