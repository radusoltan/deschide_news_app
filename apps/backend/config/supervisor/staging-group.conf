; Group wrapper — allows `supervisorctl start staging:*` / `status staging:*` /
; `stop staging:*` as batch operations. Individual programs remain
; independently controllable.
;
; NOTE on `[group:staging]`: the group directive ONLY claims programs that
; already exist as `[program:...]` sections loaded from other files in
; conf.d/. The order of reread/update matters: supervisor loads all program
; files first, then binds the group. That's handled by the default
; alphabetical glob order — `staging-group.conf` sorts after all
; `messenger-*-staging.conf`, `symfony-serve-staging.conf`, and
; `nextjs-staging.conf` in the include directory.

[group:staging]
programs=messenger-scheduler-default-staging,symfony-serve-staging,nextjs-staging
