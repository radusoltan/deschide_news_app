; Group wrapper — allows `supervisorctl start staging:*` / `status staging:*` /
; `stop staging:*` as batch operations. Individual programs remain
; independently controllable.
;
; NOTE on `[group:staging]`: the group directive ONLY claims programs that
; already exist as `[program:...]` sections loaded from other files in
; conf.d/. The order of reread/update matters: supervisor loads all program
; files first, then binds the group. That's handled by the default
; alphabetical glob order — `staging-group.conf` sorts after all
; `messenger-*-staging.conf`, `symfony-serve-staging.conf`, and
; `nextjs-staging.conf` in the include directory.

[group:staging]
programs=messenger-ai-async-staging,messenger-briefing-staging,messenger-editorial-flash-staging,messenger-editorial-signal-staging,messenger-editorial-verification-extract-staging,messenger-editorial-verification-decide-staging,messenger-topic-detection-staging,messenger-scheduler-default-staging,messenger-scheduler-editorial-staging,messenger-scheduler-editorial-signal-staging,messenger-scheduler-escalation-expiration-staging,messenger-scheduler-signal-stabilization-staging,messenger-scheduler-tag-maintenance-staging,messenger-scheduler-translation-staging,messenger-python-scraper-staging,symfony-serve-staging,nextjs-staging
