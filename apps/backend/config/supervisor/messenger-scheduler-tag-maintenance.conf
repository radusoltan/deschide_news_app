; Sprint 56 T56.03 — scheduler_tag_maintenance consumer.
;
; Drains the scheduler transport bound to TagMaintenanceScheduleProvider
; (`#[AsSchedule('tag_maintenance')]`), which emits daily tag-cleanup ticks
; (orphan prune, slug repair). Non-pipeline-critical — added in this batch
; for consistency: every scheduler provider should have a matching consumer
; so supervisorctl status is a complete view of scheduled work.

[program:messenger-scheduler-tag-maintenance]
command=/usr/bin/symfony console messenger:consume scheduler_tag_maintenance --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-scheduler-tag-maintenance.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-scheduler-tag-maintenance.error.log
stderr_logfile_maxbytes=10MB
