; Sprint 56 T56.03 — scheduler_translation consumer.
;
; Drains the scheduler transport bound to TranslationScheduleProvider
; (`#[AsSchedule('translation')]`), which emits TranslatePendingBatch ticks
; (5/15 min cadence per S51 design). Not strictly pipeline-critical for S56
; but required for the public-surface translation feed — without this
; consumer, pending translations would never be batched out of the queue.

[program:messenger-scheduler-translation]
command=/usr/bin/symfony console messenger:consume scheduler_translation --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-scheduler-translation.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-scheduler-translation.error.log
stderr_logfile_maxbytes=10MB
