; Frontend Next.js for staging. Port 3001 (dev uses 3005). Bind all interfaces.
;
; Next.js does NOT auto-load .env.staging (unlike Symfony Dotenv). Loading
; is performed explicitly via a bash wrapper that sources both .env.staging
; and .env.staging.local before exec'ing the Next.js server. NODE_ENV=production
; forces Next.js into built/optimized mode (same as `pnpm start`); the
; NEXT_PUBLIC_ENV=staging marker in .env.staging distinguishes from real prod.
;
; Prerequisite: `pnpm build` must have been run in the frontend with staging
; env vars sourced so the NEXT_PUBLIC_* values are inlined into the bundle.

[program:nextjs-staging]
command=/bin/bash -c "set -a; source /var/www/deschide_news_app/apps/frontend/.env.staging; source /var/www/deschide_news_app/apps/frontend/.env.staging.local; set +a; exec /var/www/deschide_news_app/apps/frontend/node_modules/.bin/next start -p 3001"
directory=/var/www/deschide_news_app/apps/frontend
user=radu
environment=NODE_ENV=production,HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin:/home/radu/.local/share/pnpm"
numprocs=1
autostart=false
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=10
stopsignal=TERM
redirect_stderr=false
stdout_logfile=/var/log/deschide/staging/nextjs-staging.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/deschide/staging/nextjs-staging.error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
