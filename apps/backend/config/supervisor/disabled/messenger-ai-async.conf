[program:messenger-ai-async]
command=/usr/bin/symfony console messenger:consume ai_async --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=false
autorestart=false
startsecs=5
startretries=10
stopwaitsecs=60
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-ai-async.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-ai-async.error.log
stderr_logfile_maxbytes=10MB
