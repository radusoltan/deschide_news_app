; Sprint 55 T55.3 — writer transport pool (ADR-020 L3 layer).
;
; Consumes WriteFlashMessage (T55.3) and WriteDevelopingStoryMessage (T55.4).
; Two workers are sufficient — writer invocation volume is low compared to the
; verification pool, and each call serialises a Haiku round-trip + PostApprovalDispatcher
; fan-out to translations + ingestion.
;
; Pool sits off the legacy `editorial` queue deliberately: that queue still holds
; ~7286 stale messages and stays autostart=false until drained (out of S55 scope).

[program:messenger-editorial-flash]
command=/usr/bin/symfony console messenger:consume editorial_flash --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-editorial-flash.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-editorial-flash.error.log
stderr_logfile_maxbytes=10MB
