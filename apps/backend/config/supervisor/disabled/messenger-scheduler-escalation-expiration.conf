; Sprint 56 T56.03 — scheduler_escalation_expiration consumer.
;
; Drains the scheduler transport bound to EscalationExpirationScheduleProvider
; (`#[AsSchedule('escalation_expiration')]`), which emits ExpireEscalationsMessage
; every 60s per ADR-020 D9 + D12 to mark editorial_escalation_log rows past
; `expires_at` as `decision=EXPIRED`. Provider + handler both gate on
; `editorial.pipeline.enabled`; consumer stays up so S56 flag flips take
; effect without a supervisor restart.

[program:messenger-scheduler-escalation-expiration]
command=/usr/bin/symfony console messenger:consume scheduler_escalation_expiration --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-scheduler-escalation-expiration.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-scheduler-escalation-expiration.error.log
stderr_logfile_maxbytes=10MB
