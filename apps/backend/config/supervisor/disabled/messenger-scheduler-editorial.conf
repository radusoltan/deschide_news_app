; Sprint 56 T56.03 — scheduler_editorial consumer.
;
; Drains the scheduler transport bound to EditorialScheduleProvider
; (`#[AsSchedule('editorial')]`), which emits weekly summary / dossier
; generation ticks (Sprint 22+). Not pipeline-critical for S56 but added
; for consistency so supervisorctl status is a complete scheduler inventory.

[program:messenger-scheduler-editorial]
command=/usr/bin/symfony console messenger:consume scheduler_editorial --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-scheduler-editorial.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-scheduler-editorial.error.log
stderr_logfile_maxbytes=10MB
