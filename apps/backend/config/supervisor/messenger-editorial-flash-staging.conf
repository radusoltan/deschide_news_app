; Sprint 55 T55.3 (staging mirror) — writer transport pool.
; Staging clone of messenger-editorial-flash. Mirrors dev numprocs=2.

[program:messenger-editorial-flash-staging]
command=/usr/bin/symfony console messenger:consume editorial_flash --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=APP_ENV=staging,HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=false
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/staging/messenger-editorial-flash-staging.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/staging/messenger-editorial-flash-staging.error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
