; Backend HTTP server for staging. Port 8001 (dev uses 8081 via symfony serve).
;
; Uses PHP built-in server (`php -S`) directly rather than `symfony serve`
; because the Symfony CLI tracks server state per project root and refuses
; to spawn a 2nd instance for the same backend root (dev owns /var/www/
; deschide_news_app/apps/backend on :8081). PHP built-in server has no
; such per-project lock; PHP_CLI_SERVER_WORKERS=4 provides basic concurrency.
;
; APP_ENV=staging triggers .env.staging + .env.staging.local cascade.
; Nginx vhost api.staging.news-app.local proxies to this port.

[program:symfony-serve-staging]
command=/usr/bin/php -d variables_order=EGPCS -S 127.0.0.1:8001 -t /var/www/deschide_news_app/apps/backend/public /var/www/deschide_news_app/apps/backend/public/index.php
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=APP_ENV=staging,PHP_CLI_SERVER_WORKERS=4,HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=false
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=10
stopsignal=TERM
redirect_stderr=false
stdout_logfile=/var/log/deschide/staging/symfony-serve-staging.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stderr_logfile=/var/log/deschide/staging/symfony-serve-staging.error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
