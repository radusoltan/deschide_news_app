; Staging mirror of scheduler consumers (default + tag-maintenance + translation).
; All autostart=false — SV scenarios activate individually.

[program:messenger-scheduler-default-staging]
command=/usr/bin/symfony console messenger:consume scheduler_default --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=APP_ENV=staging,HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=false
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/staging/messenger-scheduler-default-staging.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/staging/messenger-scheduler-default-staging.error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

