; Sprint 56 T56.03 — scheduler_signal_stabilization consumer.
;
; Drains the scheduler transport bound to SignalStabilizationScheduleProvider
; (`#[AsSchedule('signal_stabilization')]`), which emits FlushStabilizedSignals
; every 10s per ADR-020 D2. The handler pops signals whose stabilization window
; has elapsed and dispatches AggregateSignalsMessage to the L2 verification
; chain. Pipeline-critical for S56 activation: without this consumer the
; signal buffer never drains and no verification is attempted.

[program:messenger-scheduler-signal-stabilization]
command=/usr/bin/symfony console messenger:consume scheduler_signal_stabilization --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/messenger-scheduler-signal-stabilization.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/messenger-scheduler-signal-stabilization.error.log
stderr_logfile_maxbytes=10MB
