; Sprint 55 T55.1 (staging mirror) — Transport split per ADR-020 D2 + S55 audit D3.
; Two independently-scaled pools: extract (high-volume ticks) + decide (low-volume aggregate/verify).

[program:messenger-editorial-verification-extract-staging]
command=/usr/bin/symfony console messenger:consume editorial_verification_extract --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=APP_ENV=staging,HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=4
process_name=%(program_name)s_%(process_num)02d
autostart=false
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/staging/messenger-editorial-verification-extract-staging.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/staging/messenger-editorial-verification-extract-staging.error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:messenger-editorial-verification-decide-staging]
command=/usr/bin/symfony console messenger:consume editorial_verification_decide --time-limit=3600 --memory-limit=256M -vv
directory=/var/www/deschide_news_app/apps/backend
user=radu
environment=APP_ENV=staging,HOME="/home/radu",PATH="/usr/local/bin:/usr/bin:/bin"
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=false
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=15
redirect_stderr=false
stdout_logfile=/var/log/deschide/staging/messenger-editorial-verification-decide-staging.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/deschide/staging/messenger-editorial-verification-decide-staging.error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
