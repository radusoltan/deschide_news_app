# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Varnish cache configuration
    varnish.host: '%env(default::VARNISH_HOST)%'
    varnish.port: '%env(int:default::VARNISH_PORT)%'
    varnish.enabled: '%env(bool:default::VARNISH_ENABLED)%'

    # Notification cleanup
    app.notification_retention_days: 90

    # Frontend revalidation URL (env-configurable, avoids hardcoded localhost)
    frontend_revalidate_url_default: 'http://localhost:3005/api/revalidate-articles'

    # Gemini CLI path for translation workflow
    gemini_cli_path: '%env(default:gemini_cli_default:GEMINI_CLI_PATH)%'
    gemini_cli_default: '/usr/bin/gemini'

    # Home directory for Gemini CLI subprocess
    gemini_home_dir: '%env(default:gemini_home_dir_default:GEMINI_HOME_DIR)%'
    gemini_home_dir_default: '/home/radu'

    # Claude CLI path for AI Newsroom Assistant (Sprint 20)
    claude_cli_path: '%env(default:claude_cli_default:CLAUDE_CLI_PATH)%'
    claude_cli_default: '/home/radu/.local/bin/claude'

    # Cloudflare CDN configuration
    cloudflare.api_token: '%env(default::CLOUDFLARE_API_TOKEN)%'
    cloudflare.zone_id: '%env(default::CLOUDFLARE_ZONE_ID)%'
    cloudflare.enabled: '%env(bool:default::CLOUDFLARE_ENABLED)%'
    cloudflare.domain: '%env(default:api_domain:CLOUDFLARE_DOMAIN)%'
    api_domain: 'https://api.deschide.md'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $environment: '%kernel.environment%'
            # ADR-023 D9 — env-driven ES index prefix; only binds to ctors declaring this param.
            $elasticsearchIndexPrefix: '%env(ELASTICSEARCH_INDEX_PREFIX)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Gedmo Translatable Listener (alias for autowiring)
    Gedmo\Translatable\TranslatableListener:
        alias: stof_doctrine_extensions.listener.translatable
        public: false

    # Romanian Slugger Service
    App\Service\RomanianSlugger:
        public: true

    # Gedmo Sluggable Listener with Romanian transliterator
    Gedmo\Sluggable\SluggableListener:
        alias: stof_doctrine_extensions.listener.sluggable
        public: false

    # Configure the sluggable listener with Romanian transliterator
    # TEMPORARILY DISABLED - causing service definition issues
    # stof_doctrine_extensions.listener.sluggable:
    #     calls:
    #         - [setTransliterator, [['App\Service\RomanianSlugger', 'slugifyStatic']]]

    # Elasticsearch Services (split from ElasticService — T38.4 SRP)
    App\Service\Elasticsearch\ElasticIndexManager:
        arguments:
            $elasticsearchHost: '%env(ELASTICSEARCH_HOST)%'
            $elasticsearchUser: '%env(ELASTICSEARCH_USER)%'
            $elasticsearchPassword: '%env(ELASTICSEARCH_PASSWORD)%'
            $elasticsearchVerifySsl: '%env(bool:ELASTICSEARCH_VERIFY_SSL)%'

    App\Service\Elasticsearch\ArticleSearchService:
        arguments:
            $elasticsearchHost: '%env(ELASTICSEARCH_HOST)%'
            $elasticsearchUser: '%env(ELASTICSEARCH_USER)%'
            $elasticsearchPassword: '%env(ELASTICSEARCH_PASSWORD)%'
            $elasticsearchVerifySsl: '%env(bool:ELASTICSEARCH_VERIFY_SSL)%'

    App\Service\Elasticsearch\ElasticDocumentService:
        arguments:
            $elasticsearchHost: '%env(ELASTICSEARCH_HOST)%'
            $elasticsearchUser: '%env(ELASTICSEARCH_USER)%'
            $elasticsearchPassword: '%env(ELASTICSEARCH_PASSWORD)%'
            $elasticsearchVerifySsl: '%env(bool:ELASTICSEARCH_VERIFY_SSL)%'

    # Image Elasticsearch Service
    App\Service\ImageElasticService:
        arguments:
            $elasticsearchHost: '%env(ELASTICSEARCH_HOST)%'
            $elasticsearchUser: '%env(ELASTICSEARCH_USER)%'
            $elasticsearchPassword: '%env(ELASTICSEARCH_PASSWORD)%'
            $elasticsearchVerifySsl: '%env(bool:ELASTICSEARCH_VERIFY_SSL)%'

    # Redis Client for Performance Service and Sessions
    Predis\Client:
        arguments:
            - scheme: 'tcp'
              host: 'localhost'
              port: 6379
              database: 1

    # Redis Session Handler
    Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler:
        arguments:
            - '@Predis\Client'
            -
                prefix: 'deschide_session:'
                ttl: 86400

    # Cache Service (split from PerformanceService — T38.4 SRP)
    App\Service\Cache\CacheService:
        arguments:
            $redis: '@Predis\Client'
            $logger: '@logger'

    # Analytics Service (split from PerformanceService — T38.4 SRP)
    App\Service\Analytics\AnalyticsService:
        arguments:
            $redis: '@Predis\Client'
            $logger: '@logger'

    # Cached Article Provider (Decorator)
    App\State\CachedArticleProvider:
        decorates: App\State\ArticleProvider
        arguments:
            $decorated: '@.inner'
            $performance: '@App\Service\Cache\CacheService'
            $requestStack: '@request_stack'
            $logger: '@logger'

    # Cached Category Provider (Decorator)
    App\State\CachedCategoryProvider:
        decorates: App\State\CategoryProvider
        arguments:
            $decorated: '@.inner'
            $performance: '@App\Service\Cache\CacheService'
            $requestStack: '@request_stack'
            $logger: '@logger'

    # Prometheus Storage Adapter (Redis)
    Prometheus\Storage\Redis:
        arguments:
            -
                host: '%prometheus.storage.redis.host%'
                port: '%prometheus.storage.redis.port%'
                database: '%prometheus.storage.redis.database%'
                password: '%prometheus.storage.redis.password%'
                timeout: '%prometheus.storage.redis.timeout%'
                read_timeout: '%prometheus.storage.redis.read_timeout%'
                persistent_connections: '%prometheus.storage.redis.persistent_connections%'
                prefix: '%prometheus.storage.redis.prefix%'

    # Prometheus Collector Registry
    Prometheus\CollectorRegistry:
        arguments:
            - '@Prometheus\Storage\Redis'

    # Mercure JWT Cookie Listener (sets subscribe cookie at login)
    App\EventListener\MercureJwtCookieListener:
        arguments:
            $mercureJwtSecret: '%env(MERCURE_JWT_SECRET)%'

    # LiveText Notification Service (Mercure)
    App\Service\LiveTextNotificationService:
        arguments:
            $httpClient: '@http_client'
            $logger: '@logger'
            $mercureUrl: '%env(MERCURE_URL)%'
            $mercurePublisherJwt: '%env(MERCURE_JWT_SECRET)%'

    # Admin Notification Service (Mercure)
    App\Service\NotificationService:
        arguments:
            $mercureUrl: '%env(MERCURE_URL)%'
            $mercurePublisherJwt: '%env(MERCURE_JWT_SECRET)%'

    # Embed Controller
    App\Controller\EmbedController:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    # Social Media Service
    App\Service\SocialMediaService:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'
            $twitterApiKey: '%env(TWITTER_API_KEY)%'
            $twitterApiSecret: '%env(TWITTER_API_SECRET)%'
            $twitterAccessToken: '%env(TWITTER_ACCESS_TOKEN)%'
            $twitterAccessSecret: '%env(TWITTER_ACCESS_SECRET)%'
            $facebookPageId: '%env(FACEBOOK_PAGE_ID)%'
            $facebookAccessToken: '%env(FACEBOOK_ACCESS_TOKEN)%'
            $telegramBotToken: '%env(TELEGRAM_BOT_TOKEN)%'
            $telegramChannelId: '%env(TELEGRAM_CHANNEL_ID)%'

    # Varnish Cache Service (HTTP Cache Layer)
    App\Service\VarnishCacheService:
        arguments:
            $varnishHost: '%varnish.host%'
            $varnishPort: '%varnish.port%'
            $varnishEnabled: '%varnish.enabled%'

    # Cloudflare CDN Service (Global Edge Cache)
    App\Service\CloudflareCacheService:
        arguments:
            $cloudflareApiToken: '%cloudflare.api_token%'
            $cloudflareZoneId: '%cloudflare.zone_id%'
            $cloudflareEnabled: '%cloudflare.enabled%'

    # Multi-tier cache invalidation subscriber (Cloudflare + Varnish)
    App\EventSubscriber\MultiTierCacheInvalidationSubscriber:
        arguments:
            $apiDomain: '%cloudflare.domain%'
        tags:
            - { name: kernel.event_subscriber }

    # Test Cache Headers Subscriber (test environment only)
    App\EventSubscriber\TestCacheHeadersSubscriber:
        arguments:
            $environment: '%kernel.environment%'

    # Health Check Service
    App\Service\HealthCheckService:
        arguments:
            $elasticsearchUrl: '%env(ELASTICSEARCH_HOST)%'
            $elasticsearchPassword: '%env(ELASTICSEARCH_PASSWORD)%'

    # Centralized Gemini CLI Service (replaces 18 duplicated Process calls)
    App\Service\Ai\Provider\GeminiCliService:
        arguments:
            $geminiCliPath: '%gemini_cli_path%'
            $homeDir: '%gemini_home_dir%'

    # ADR-024 D2 dispatcher — T57.P7.C1 adds Gemini-transport branch; needs
    # projectDir for GeminiCliService cwd option (agent-file resolution).
    App\Agent\AgentDispatcher:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Translation Handler (uses GeminiCliService)
    App\MessageHandler\TranslateArticleHandler:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Entity Translation Handler (uses GeminiCliService — categories, authors)
    App\MessageHandler\TranslateEntityHandler:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # Elasticsearch Trilingual Index Manager (Sprint 16)
    App\Service\Search\ElasticsearchIndexManager:
        arguments:
            $elasticsearchHost: '%env(ELASTICSEARCH_HOST)%'
            $elasticsearchUser: '%env(ELASTICSEARCH_USER)%'
            $elasticsearchPassword: '%env(ELASTICSEARCH_PASSWORD)%'
            $elasticsearchVerifySsl: '%env(bool:ELASTICSEARCH_VERIFY_SSL)%'

    # Gemini Structured Translator (uses GeminiCliService — Sprint 16)
    App\Service\Translation\GeminiStructuredTranslator: ~

    # AI Newsroom: Anthropic API Client (for production with API key)
    App\Service\Ai\AnthropicApiClient:
        arguments:
            $anthropicApiKey: '%env(default::ANTHROPIC_API_KEY)%'

    # AI Newsroom: Claude CLI Client (uses `claude -p` subprocess, like Gemini CLI)
    App\Service\Ai\ClaudeCliClient:
        arguments:
            $claudeCliPath: '%claude_cli_path%'

    # AI Newsroom: Use Claude CLI as default client (same pattern as Gemini CLI for translations)
    App\Service\Ai\AnthropicClientInterface:
        alias: App\Service\Ai\ClaudeCliClient

    # AI Multi-Provider Architecture (Sprint 21)
    App\Service\Ai\Provider\AnthropicProvider:
        tags: ['ai.provider']

    App\Service\Ai\Provider\GeminiCliProvider:
        tags: ['ai.provider']

    App\Service\Ai\Provider\AiProviderRegistry:
        arguments:
            $providers: !tagged_iterator ai.provider

    # Dev Reset Command (full dev environment reset)
    App\Command\Dev\DevResetCommand:
        arguments:
            $appEnv: '%kernel.environment%'
            $em: '@doctrine.orm.entity_manager'

    # Translation Evaluator Service (uses GeminiCliService — Sprint 18)
    App\Service\Translation\TranslationEvaluatorService: ~

    # YouTube Sync Service (Video Emissions)
    App\Service\YouTubeSyncService:
        arguments:
            $youtubeApiKey: '%env(YOUTUBE_API_KEY)%'

# Test environment specific configuration
when@test:
    services:
        # Make password hasher public for test fixtures
        Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface:
            alias: 'security.user_password_hasher'
            public: true

