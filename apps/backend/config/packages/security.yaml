security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            entry_point: jwt
            json_login:
                check_path: /api/login_check
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~
            refresh_jwt:
                check_path: /api/token/refresh
        main:
            lazy: true
            provider: app_user_provider

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # Public access endpoints
        - { path: ^/api/(login_check|token/refresh), roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/slug, roles: PUBLIC_ACCESS }
        - { path: ^/api/redirects, roles: PUBLIC_ACCESS }

        # Prometheus metrics endpoint (consider restricting by IP in production)
        - { path: ^/metrics, roles: PUBLIC_ACCESS }

        # Public trending endpoint (for frontend) - MUST come before admin stats
        - { path: ^/api/admin/stats/trending, roles: PUBLIC_ACCESS }

        # Admin statistics endpoints (require ROLE_ADMIN) - MUST come before general /api/stats
        - { path: ^/api/admin/stats, roles: ROLE_ADMIN }

        # Public tracking endpoints (analytics) - general catch-all for /api/track and /api/stats
        - { path: ^/api/track, roles: PUBLIC_ACCESS }
        - { path: ^/api/stats, roles: PUBLIC_ACCESS }

        # LiveText test endpoints (for development/testing Mercure)
        - { path: ^/api/live-texts/test-mercure, roles: PUBLIC_ACCESS }
        - { path: ^/api/live-texts/mercure-info, roles: PUBLIC_ACCESS }

        # LiveText analytics and view tracking (public access for viewers)
        - { path: ^/api/live_texts/.+/track_view, roles: PUBLIC_ACCESS }
        - { path: ^/api/live_texts/.+/viewers, roles: PUBLIC_ACCESS }
        - { path: ^/api/live_texts/generate_session, roles: PUBLIC_ACCESS }

        # Embed API (public access for external sites)
        - { path: ^/api/embed, roles: PUBLIC_ACCESS }

        # Archive public endpoints (navigation, stats, categories)
        - { path: ^/api/archive, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/archived_articles, roles: PUBLIC_ACCESS, methods: [GET] }

        # Public READ access for frontend (GET only)
        - { path: ^/api/(articles|categories|authors|images|thumbnails|important_articles|thumbnail_profiles|tags|live_texts|live_text_posts|live_text_collaborators|live_text_templates|live_text_reactions), roles: PUBLIC_ACCESS, methods: [GET] }

        # Admin/Editor access for write operations (POST, PUT, PATCH, DELETE) - templates allow POST for reactions
        - { path: ^/api/live_text_reactions, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/api/(articles|categories|authors|images|thumbnails|important_articles|thumbnail_profiles|tags|live_texts|live_text_posts|live_text_collaborators|live_text_templates), roles: [ROLE_ADMIN, ROLE_EDITOR], methods: [POST, PUT, PATCH, DELETE] }

        # All other API routes require authentication
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
