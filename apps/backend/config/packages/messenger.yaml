framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

            # Cache operations transport (high priority)
            cache_async: '%env(MESSENGER_TRANSPORT_DSN)%'

            # Statistics operations transport (medium priority)
            stats_async: '%env(MESSENGER_TRANSPORT_DSN)%'

            # Translation queues — ordered by priority.
            # Run worker: messenger:consume translations_critical translations_urgent translations_high translations -vv
            # Symfony consumes queues left-to-right: critical first, then urgent, etc.
            translations_critical:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations_critical
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 2
                    max_delay: 30000

            translations_urgent:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations_urgent
                retry_strategy:
                    max_retries: 3
                    delay: 3000
                    multiplier: 2
                    max_delay: 45000

            translations_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations_high
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

            translations:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

        routing:
            # Route your messages to the transports

            # Statistics messages (Sprint 3)
            'App\Message\PageViewEvent': stats_async
            'App\Message\SessionEndEvent': stats_async

            # Tag maintenance messages (async processing)
            'App\Message\CleanupUnusedTagsMessage': async
            'App\Message\RecalculateTagCountsMessage': async
            'App\Message\CheckOrphanedTagsMessage': async

            # Short link analytics (async for fast redirects)
            'App\Message\ShortLinkClickMessage': async

            # Translation default routing — NORMAL priority transport.
            # TranslationPriorityDispatcher overrides via TransportNamesStamp
            # to route CRITICAL/URGENT/HIGH messages to their priority queues;
            # raw bus->dispatch() callers (RssFeedImporter, TranslationController)
            # fall back to NORMAL via this default.
            'App\Message\TranslateArticleMessage': translations
            'App\Message\TranslateEntityMessage': translations

            # Batch translation scheduling (processed by TranslatePendingBatchHandler)
            'App\Message\TranslatePendingBatch': async

            # Mercure real-time updates (Sprint 20)
            'Symfony\Component\Mercure\Update': async

