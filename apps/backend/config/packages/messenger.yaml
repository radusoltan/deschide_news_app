framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

            # Cache operations transport (high priority)
            cache_async: '%env(MESSENGER_TRANSPORT_DSN)%'

            # Statistics operations transport (medium priority)
            stats_async: '%env(MESSENGER_TRANSPORT_DSN)%'

            # Translation queues — ordered by priority.
            # Run worker: messenger:consume translations_critical translations_urgent translations_high translations -vv
            # Symfony consumes queues left-to-right: critical first, then urgent, etc.
            translations_critical:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations_critical
                retry_strategy:
                    max_retries: 3
                    delay: 2000
                    multiplier: 2
                    max_delay: 30000

            translations_urgent:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations_urgent
                retry_strategy:
                    max_retries: 3
                    delay: 3000
                    multiplier: 2
                    max_delay: 45000

            translations_high:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations_high
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

            translations:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

            # Scraping pipeline transport (Sprint 16)
            scraping:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: scraping
                retry_strategy:
                    max_retries: 2
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

            # AI processing transport — dedicated queue with generous retries
            # for Gemini CLI calls (translation, SEO, topic detection, clustering)
            ai_async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ai_async
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 120000

            # Python scraper transport (Sprint 46)
            python_scraper:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: python_scraper
                retry_strategy:
                    max_retries: 2
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

            # Topic detection transport — separate from ai_async to avoid
            # competing with translation/generation workload (ADR-015)
            topic_detection:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: topic_detection
                retry_strategy:
                    max_retries: 2
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

            # Briefing generation transport — isolated from editorial/ai_async
            # to prevent long AI calls blocking curation UX (ADR-016 D3/D8)
            briefing:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: briefing
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 120000

            # Editorial processing transport (Sprint 16)
            editorial:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: editorial
                retry_strategy:
                    max_retries: 3
                    delay: 3000
                    multiplier: 2
                    max_delay: 45000

        routing:
            # Route your messages to the transports
            # Cache messages (Sprint 2)
            # 'App\Message\CacheWarmEvent': cache_async

            # Statistics messages (Sprint 3)
            'App\Message\PageViewEvent': stats_async
            'App\Message\SessionEndEvent': stats_async

            # Tag maintenance messages (async processing)
            'App\Message\CleanupUnusedTagsMessage': async
            'App\Message\RecalculateTagCountsMessage': async
            'App\Message\CheckOrphanedTagsMessage': async

            # Short link analytics (async for fast redirects)
            'App\Message\ShortLinkClickMessage': async

            # Translation: routed to ai_async (Gemini CLI subprocess)
            'App\Message\TranslateArticleMessage': ai_async
            'App\Message\TranslateEntityMessage': ai_async

            # Batch translation scheduling (processed by TranslatePendingBatchHandler)
            'App\Message\TranslatePendingBatch': async

            # SEO optimization (Gemini AI generates metaTitle, metaDescription, tags)
            'App\Message\OptimizeSeoMessage': ai_async

            # Scraping pipeline (Sprint 16)
            'App\Message\Editorial\ScrapeSourceMessage': scraping
            'App\Message\Editorial\ProcessScrapedArticleMessage': editorial

            # AI ingestion pipeline (Sprint 17)
            'App\Message\Editorial\IngestArticleMessage': editorial

            # Translation evaluation pipeline (Sprint 18)
            'App\Message\Editorial\EvaluateTranslationMessage': editorial

            # Editorial scheduler (Sprint 22 — daily briefing, weekly summary, dossiers)
            'App\Message\Editorial\GenerateDailyBriefingMessage': editorial
            'App\Message\Editorial\GenerateWeeklySummaryMessage': editorial
            'App\Message\Editorial\GenerateDossiersMessage': editorial

            # Aggregator pipeline (Sprint 24)
            'App\Message\Aggregator\ProcessAggregatorResultMessage': editorial
            'App\Message\Aggregator\TriggerAggregatorRunMessage': editorial

            # Clustering pipeline (Sprint 30-32)
            'App\Message\Clustering\ClusterPressReleaseMessage': editorial
            'App\Message\Clustering\TriggerClusterRunMessage': editorial
            'App\Message\Clustering\TriggerClusterScoringMessage': editorial
            'App\Message\Clustering\SummarizeClusterMessage': ai_async

            # Python scraper pipeline (Sprint 46)
            'App\Message\Scraping\PythonScrapeMessage': python_scraper

            # Topic detection pipeline (Sprint 49, ADR-015)
            'App\Message\Topic\DetectTopicsForPressReleaseMessage': topic_detection

            # Topic briefing pipeline (Sprint 50, ADR-016)
            'App\Message\Topic\TriggerTopicBriefingRunMessage': briefing
            'App\Message\Topic\GenerateTopicBriefingMessage': briefing

            # Mercure real-time updates (Sprint 20)
            'Symfony\Component\Mercure\Update': async

