framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

            # Cache operations transport (high priority)
            cache_async: '%env(MESSENGER_TRANSPORT_DSN)%'

            # Statistics operations transport (medium priority)
            stats_async: '%env(MESSENGER_TRANSPORT_DSN)%'

            # Translation operations transport (long-running, separate queue)
            translations:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: translations
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
                    max_delay: 60000

        routing:
            # Route your messages to the transports
            # Cache messages (Sprint 2)
            # 'App\Message\CacheWarmEvent': cache_async

            # Statistics messages (Sprint 3)
            'App\Message\PageViewEvent': stats_async
            'App\Message\SessionEndEvent': stats_async

            # Tag maintenance messages (async processing)
            'App\Message\CleanupUnusedTagsMessage': async
            'App\Message\RecalculateTagCountsMessage': async
            'App\Message\CheckOrphanedTagsMessage': async

            # Short link analytics (async for fast redirects)
            'App\Message\ShortLinkClickMessage': async

            # Translation workflow (long-running Gemini CLI calls)
            'App\Message\TranslateArticleMessage': translations

