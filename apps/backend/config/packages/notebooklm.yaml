parameters:
    notebooklm.enabled: '%env(bool:default:notebooklm_enabled_default:NOTEBOOKLM_ENABLED)%'
    notebooklm_enabled_default: 'false'

    notebooklm.cli_path: '%env(default:notebooklm_cli_default:NOTEBOOKLM_CLI_PATH)%'
    notebooklm_cli_default: '/home/radu/.local/bin/notebooklm'

    notebooklm.briefing_notebook_id: '%env(default::NOTEBOOKLM_BRIEFING_NOTEBOOK_ID)%'
    notebooklm.weekly_notebook_id: '%env(default::NOTEBOOKLM_WEEKLY_NOTEBOOK_ID)%'

    notebooklm.notebooks:
        politica: '%env(default::NOTEBOOKLM_POLITICA_ID)%'
        integrare_ue: '%env(default::NOTEBOOKLM_INTEGRARE_UE_ID)%'
        economie: '%env(default::NOTEBOOKLM_ECONOMIE_ID)%'
        justitie: '%env(default::NOTEBOOKLM_JUSTITIE_ID)%'
        transnistria: '%env(default::NOTEBOOKLM_TRANSNISTRIA_ID)%'
        energie: '%env(default::NOTEBOOKLM_ENERGIE_ID)%'
