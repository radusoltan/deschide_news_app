parameters:
    notebooklm.enabled: '%env(bool:default:notebooklm_enabled_default:NOTEBOOKLM_ENABLED)%'
    notebooklm_enabled_default: 'false'

    notebooklm.cli_path: '%env(default:notebooklm_cli_default:NOTEBOOKLM_CLI_PATH)%'
    notebooklm_cli_default: '/home/radu/.local/bin/notebooklm'

    notebooklm_briefing_default: ''
    notebooklm.briefing_notebook_id: '%env(default:notebooklm_briefing_default:NOTEBOOKLM_BRIEFING_NOTEBOOK_ID)%'
    notebooklm_weekly_default: ''
    notebooklm.weekly_notebook_id: '%env(default:notebooklm_weekly_default:NOTEBOOKLM_WEEKLY_NOTEBOOK_ID)%'

    notebooklm_notebook_default: ''
    notebooklm.notebooks:
        politica: '%env(default:notebooklm_notebook_default:NOTEBOOKLM_POLITICA_ID)%'
        integrare_ue: '%env(default:notebooklm_notebook_default:NOTEBOOKLM_INTEGRARE_UE_ID)%'
        economie: '%env(default:notebooklm_notebook_default:NOTEBOOKLM_ECONOMIE_ID)%'
        justitie: '%env(default:notebooklm_notebook_default:NOTEBOOKLM_JUSTITIE_ID)%'
        transnistria: '%env(default:notebooklm_notebook_default:NOTEBOOKLM_TRANSNISTRIA_ID)%'
        energie: '%env(default:notebooklm_notebook_default:NOTEBOOKLM_ENERGIE_ID)%'
