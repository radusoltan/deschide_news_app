doctrine:
    dbal:
        default_connection: default
        types:
            text_array: App\Doctrine\Type\TextArrayType
        connections:
            default:
                url: '%env(resolve:DATABASE_URL)%'
                driver: 'pdo_pgsql'
                server_version: '18'
                profiling_collect_backtrace: '%kernel.debug%'
                # Note: use_savepoints removed in DBAL 4.x (savepoints now always enabled)
                options:
                    # Connection timeout: 5 seconds (prevents hanging on connection issues)
                    connect_timeout: 5
                    # Statement timeout: 30 seconds (prevents runaway queries)
                    options: '-c statement_timeout=30000'

            newscoop:
                url: '%env(resolve:NEWSCOOP_DATABASE_URL)%'
                driver: 'pdo_mysql'
                server_version: '10.11'
                charset: utf8mb4
                options:
                    # MySQL connection timeout
                    !php/const PDO::ATTR_TIMEOUT: 5

    orm:
        # Doctrine Bundle 3.x configuration structure
        controller_resolver:
            auto_mapping: false
        default_entity_manager: default
        entity_managers:
            default:
                connection: default
                auto_mapping: true
                naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
                identity_generation_preferences:
                    Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
                validate_xml_mapping: true
                metadata_cache_driver:
                    type: pool
                    pool: doctrine.system_cache_pool
                query_cache_driver:
                    type: pool
                    pool: doctrine.query_cache_pool
                result_cache_driver:
                    type: pool
                    pool: doctrine.result_cache_pool
                # Second Level Cache (L2) for entity caching
                second_level_cache:
                    enabled: true
                    log_enabled: '%kernel.debug%'
                    region_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool
                    regions:
                        # Default region for most entities
                        default:
                            lifetime: 3600
                            cache_driver:
                                type: pool
                                pool: doctrine.result_cache_pool
                        # Short-lived region for frequently changing data
                        short_lived:
                            lifetime: 300
                            cache_driver:
                                type: pool
                                pool: doctrine.result_cache_pool
                        # Long-lived region for rarely changing data (categories, profiles)
                        long_lived:
                            lifetime: 86400
                            cache_driver:
                                type: pool
                                pool: doctrine.result_cache_pool
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App
                    gedmo_translatable:
                        type: attribute
                        prefix: Gedmo\Translatable\Entity
                        dir: '%kernel.project_dir%/vendor/gedmo/doctrine-extensions/src/Translatable/Entity'
                        alias: GedmoTranslatable
                        is_bundle: false
                    gedmo_translator:
                        type: attribute
                        prefix: Gedmo\Translator\Entity
                        dir: '%kernel.project_dir%/vendor/gedmo/doctrine-extensions/src/Translator/Entity'
                        alias: GedmoTranslator
                        is_bundle: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            entity_managers:
                default:
                    query_cache_driver:
                        type: pool
                        pool: doctrine.system_cache_pool
                    result_cache_driver:
                        type: pool
                        pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
