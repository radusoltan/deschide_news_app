        # === SURSE LOCALE (Moldova) ===
        moldpres:
            name: 'Moldpres'
            base_url: 'https://www.moldpres.md'
            feed_urls:
                ro: 'https://www.moldpres.md/rss'
            type: 'scrape'  # No real RSS — /rss returns HTML listing page
            rate_limit: 1
            original_language: 'ro'
            is_international: false
            priority_weight: 5
            relevance_filter: false
