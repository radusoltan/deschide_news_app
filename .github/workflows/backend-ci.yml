name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-tests:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    # Service containers
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: deschide_test
          POSTGRES_USER: deschide_test
          POSTGRES_PASSWORD: deschide_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_pgsql, redis, intl, opcache, apcu
          coverage: xdebug
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        working-directory: apps/backend
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Setup environment
        working-directory: apps/backend
        run: |
          cp .env.test .env.test.local
          echo "DATABASE_URL=postgresql://deschide_test:deschide_test@127.0.0.1:5432/deschide_test?serverVersion=17&charset=utf8" >> .env.test.local
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env.test.local

      - name: Create database schema
        working-directory: apps/backend
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: Run PHPStan (Static Analysis)
        working-directory: apps/backend
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
        continue-on-error: false

      - name: Run PHP-CS-Fixer (Code Style Check)
        working-directory: apps/backend
        run: |
          if [ -f .php-cs-fixer.dist.php ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff --format=checkstyle
          else
            echo "⚠️ PHP-CS-Fixer config not found, skipping code style check"
          fi
        continue-on-error: true

      - name: Run PHPUnit Tests
        working-directory: apps/backend
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text --colors=never
        env:
          APP_ENV: test
          SYMFONY_DEPRECATIONS_HELPER: weak

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          retention-days: 7

      - name: Generate coverage summary
        working-directory: apps/backend
        run: |
          echo "## Backend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          vendor/bin/phpunit --coverage-text --colors=never | grep -E "^\s+(Lines|Methods|Classes)" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All backend tests completed" >> $GITHUB_STEP_SUMMARY

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            apps/backend/var/coverage/
            apps/backend/.phpunit.cache/
          retention-days: 7
