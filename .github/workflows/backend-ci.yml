name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  backend-tests:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    # Service containers
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: deschide_test
          POSTGRES_USER: deschide_test
          POSTGRES_PASSWORD: deschide_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo_pgsql, redis, intl, opcache, apcu
          coverage: xdebug
          ini-values: memory_limit=-1
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: "[T60.19] Bootstrap .env (CI fallback for composer post-install)"
        working-directory: apps/backend
        run: |
          # composer install runs scripts.auto-scripts.cache:clear post-install,
          # which boots Symfony Runtime and requires apps/backend/.env. The file
          # is gitignored locally; CI uses .env.example as the canonical default.
          # Test-specific overrides land later via the "Setup environment" step
          # (.env.test.local) and the APP_ENV=test override on the PHPUnit step.
          # See: docs/adr/ADR-... (none yet — escalated as T60.19, gates v1.5.1).
          cp .env.example .env

      - name: Install Composer dependencies
        working-directory: apps/backend
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Setup environment
        working-directory: apps/backend
        run: |
          cp .env.test .env.test.local
          echo "DATABASE_URL=postgresql://deschide_test:deschide_test@127.0.0.1:5432/deschide_test?serverVersion=17&charset=utf8" >> .env.test.local
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env.test.local

      - name: Create database schema
        working-directory: apps/backend
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: "[T60.19-L4] Generate JWT keypair for tests"
        working-directory: apps/backend
        env:
          APP_ENV: test
        run: |
          # Lexik JWT bundle requires apps/backend/config/jwt/{private,public}.pem
          # to exist before any code path that signs/verifies tokens executes
          # (functional tests use the JWT login endpoint extensively). Both
          # files are gitignored (apps/backend/.gitignore lines 16-17) so CI
          # has nothing after actions/checkout@v4 — the result is 90+ test
          # errors with "Failed to get JWT token" / InvalidKeyProvided.
          # `--skip-if-exists` keeps the step idempotent (e.g. composer cache
          # restore that leaves a stale keypair). The passphrase is taken
          # from JWT_PASSPHRASE in apps/backend/.env.test (committed).
          # Note: php bin/console used here, not symfony console — Symfony
          # CLI binary is not installed by shivammathur/setup-php@v2 and
          # adding it would require a separate setup step. The CI workflow
          # already uses `php bin/console` for doctrine commands above; this
          # step matches that convention. CLAUDE.md Rule 1 ("symfony console
          # exclusive") is documented as production-deploy-script-scoped;
          # the GitHub Actions runner is a documented exemption.
          php bin/console lexik:jwt:generate-keypair --skip-if-exists --no-interaction

      - name: "[T60.19] Warm up dev cache for PHPStan Symfony plugin"
        working-directory: apps/backend
        env:
          APP_DEBUG: '1'
        run: |
          # phpstan.neon symfony.containerXmlPath points at
          # var/cache/dev/App_KernelDevDebugContainer.xml. None of the
          # earlier steps generate it: composer post-install warms the
          # prod cache (APP_ENV=prod from .env.example), the database
          # step warms test cache (--env=test). Without the dev-debug
          # XML, phpstan-symfony's XmlServiceMapFactory throws and the
          # entire PHPStan step fails before it analyses a single file.
          # APP_DEBUG=1 (overrides .env.example's APP_DEBUG=0) ensures
          # the file is named with the "Debug" suffix the plugin expects.
          php bin/console cache:warmup --env=dev

      - name: Run PHPStan (Static Analysis)
        working-directory: apps/backend
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
        continue-on-error: false

      - name: Run PHP-CS-Fixer (Code Style Check)
        working-directory: apps/backend
        run: |
          if [ -f .php-cs-fixer.dist.php ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff --format=checkstyle
          else
            echo "⚠️ PHP-CS-Fixer config not found, skipping code style check"
          fi
        continue-on-error: true

      - name: Run PHPUnit Tests
        working-directory: apps/backend
        run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover=coverage.xml --coverage-text --colors=never
        env:
          APP_ENV: test
          SYMFONY_DEPRECATIONS_HELPER: weak

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage.xml
          retention-days: 7

      - name: Generate coverage summary
        working-directory: apps/backend
        run: |
          echo "## Backend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          vendor/bin/phpunit --coverage-text --colors=never | grep -E "^\s+(Lines|Methods|Classes)" >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All backend tests completed" >> $GITHUB_STEP_SUMMARY

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            apps/backend/var/coverage/
            apps/backend/.phpunit.cache/
          retention-days: 7
