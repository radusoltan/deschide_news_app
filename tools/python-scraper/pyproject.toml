[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deschide-scraper"
version = "0.1.0"
description = "CLI scraper for Deschide News — extracts content from web sources as structured JSON"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<6",
    "requests>=2.31,<3",
    "pdfplumber>=0.10,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "responses>=0.25,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
